  me3.end.anderson_dead: {ref: me3.bool.22601, path: "me3:End_Game.End002.End002_LD.Anderson_Dead"}
  me3.end.shepard_dead: {ref: me3.bool.22603, path: "me3:End_Game.End002.End002_LD.Shepard_Dead"}
  me3.player.reputation: {ref: me3.int.10380, path: "me3:Utility.Player_Info.Reputation_Points"}
  me3.player.paragon: {ref: me3.int.10159, path: "me3:Utility.Player_Info.Paragon_Points"}
  me3.player.renegade: {ref: me3.int.10160, path: "me3:Utility.Player_Info.Renegade_Points"}
