  me3.end.chose_red: {ref: me3.bool.22763, path: "me3:End_Game.End002.End002_LD.Chose_Red"}
  me3.end.chose_blue: {ref: me3.bool.22764, path: "me3:End_Game.End002.End002_LD.Chose_Blue"}
