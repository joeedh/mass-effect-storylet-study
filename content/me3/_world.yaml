  me3.tim.how_persuaded: {ref: me3.int.10665, path: "me3:Global.Illusive_Man.How_Persuaded"}
  me3.genophage.cure_real: {ref: me3.bool.18926, path: "me3:Genophage.Kro002.Writing.Genophage_Cure_Real"}
  me3.genophage.cure_sabotaged: {ref: me3.bool.18927, path: "me3:Genophage.Kro002.Writing.Genophage_Cure_Sabotaged"}
  me3.genophage.deal_revealed: {ref: me3.bool.18928, path: "me3:Genophage.Kro002.Writing.Salarian_Deal_Revealed"}
  me3.genophage.eve_dead: {ref: me3.bool.19060, path: "me3:Genophage.Kro002.Writing.Female_Krogan_Dead"}
  me3.genophage.eve_alive: {ref: me3.bool.20315, path: "me3:Genophage.Kro002.Writing.Female_Krogan_Alive"}
  me3.genophage.shot_mordin: {ref: me3.bool.19062, path: "me3:Genophage.Kro002.Writing.Killed_salarian"}
  me3.genophage.sabotage_mordin_lived: {ref: me3.bool.20494, path: "me3:Genophage.Kro002.Writing.Genophage_Cure_Sabotaged_Salarian_Lived"}
  me3.citadel.wrex_confronted: {ref: me3.bool.19769, path: "me3:Citadel.CitHub.WrexWreav_Confront.Wrex_Has_Confronted"}
  me3.rachni.queen_ally: {ref: me3.bool.17900, path: "me3:Genophage.KroGru.Writing_States.RachniQueen_is_ally"}
  me3.rachni.queen_killed: {ref: me3.bool.17901, path: "me3:Genophage.KroGru.Writing_States.RachniQueen_killed_me3"}
  me3.rachni.breeder_killed: {ref: me3.bool.17902, path: "me3:Genophage.KroGru.Writing_States.RachniBreeder_killed"}
  me3.rachni.breeder_saved: {ref: me3.bool.18846, path: "me3:Genophage.KroGru.Writing_States.Breeder_is_saved"}
  me3.rannoch.geth_destroyed: {ref: me3.bool.17787, path: "me3:Geth_Quarian.Gth002.Final_Decision.Geth_Destroyed"}
  me3.rannoch.peace: {ref: me3.bool.17789, path: "me3:Geth_Quarian.Gth002.Final_Decision.Peace"}
  me3.rannoch.quarians_dead: {ref: me3.bool.17788, path: "me3:Geth_Quarian.Gth002.Final_Decision.Quarians_Dead"}
  me3.rannoch.peace_chance: {ref: me3.int.10212, path: "me3:Geth_Quarian.Gth002.Geth_2_Writing.Peace_Chance_Score"}
  me3.coup.shepard_shot_ashley: {ref: me3.bool.18199, path: "me3:Catalyst.Cat003.500_Showdown.Ash_Shot"}
  me3.coup.shepard_shot_kaidan: {ref: me3.bool.18445, path: "me3:Catalyst.Cat003.500_Showdown.Kaidan_Shot"}
  me3.coup.kirrahe_saved_councilor: {ref: me3.bool.19189, path: "me3:Catalyst.Cat003.200_CSEC.Salarian_Councilor_Kirrahe_Save"}
  me3.coup.thane_dead: {ref: me3.bool.18714, path: "me3:Catalyst.Cat003.600_Hospital.Thane_Dead"}
  me3.horizon.miranda_killed: {ref: me3.bool.20278, path: "me3:Cerberus.CerMir.WritingStates.Miranda_killed_me3"}
  me3.horizon.miranda_survives: {ref: me3.bool.20687, path: "me3:Cerberus.CerMir.WritingStates.Miranda_survives_ME3"}
  me3.monastery.samara_dies: {ref: me3.bool.19303, path: "me3:Citadel.CitSam.Writing.samara_dies"}
  me3.monastery.falere_dies: {ref: me3.bool.19304, path: "me3:Citadel.CitSam.Writing.Falere_dies"}
  me3.cronos.done: {ref: me3.bool.19143, path: "me3:Catalyst.Cat004.Cat004_Done"}
  me3.order.{code}:
    foreach:
      - {code: ProEar, ref: me3.int.10166}
      - {code: ProMar, ref: me3.int.10167}
      - {code: ProCit, ref: me3.int.10168}
      - {code: KroGar, ref: me3.int.10213}
      - {code: Kro001, ref: me3.int.10178}
      - {code: KroGru, ref: me3.int.10182}
      - {code: KroN7a, ref: me3.int.10180}
      - {code: KroN7b, ref: me3.int.10181}
      - {code: Kro002, ref: me3.int.10179}
      - {code: Cat001, ref: me3.int.10177}
      - {code: Cat002, ref: me3.int.10183}
      - {code: Cat003, ref: me3.int.10184}
      - {code: Cat004, ref: me3.int.10185}
      - {code: Gth001, ref: me3.int.10172}
      - {code: GthN7a, ref: me3.int.10174}
      - {code: Gth002, ref: me3.int.10173}
      - {code: GthLeg, ref: me3.int.10176}
      - {code: CitSam, ref: me3.int.10195}
      - {code: OmgJck, ref: me3.int.10200}
      - {code: CerMir, ref: me3.int.10188}
      - {code: End001, ref: me3.int.10202}
      - {code: End002, ref: me3.int.10203}
      - {code: End003, ref: me3.int.10204}
    ref: "{ref}"
    path: "me3:Global.Game_Progress.Mission_Completion_Order.{code}"
  # Unmodeled shooters in the Citadel II standoff; lifted fate conditions read them.
  me3.coup.other_shot_{who}_{by}:
    foreach:
      - {who: ash, by: prothean, ref: me3.bool.19527, path: Prothean_Shot_Ash}
      - {who: ash, by: james, ref: me3.bool.19521, path: James_Shot_Ash}
      - {who: ash, by: garrus, ref: me3.bool.19519, path: Garrus_Shot_Ash}
      - {who: ash, by: edi, ref: me3.bool.19525, path: EDI_Shot_Ash}
      - {who: ash, by: liara, ref: me3.bool.19523, path: Liara_Shot_Ash}
      - {who: kaidan, by: prothean, ref: me3.bool.19528, path: Prothean_Shot_Kaidan}
      - {who: kaidan, by: james, ref: me3.bool.19522, path: James_Shot_Kaidan}
      - {who: kaidan, by: garrus, ref: me3.bool.19520, path: Garrus_Shot_Kaidan}
      - {who: kaidan, by: edi, ref: me3.bool.19526, path: EDI_Shot_Kaidan}
      - {who: kaidan, by: liara, ref: me3.bool.19524, path: Liara_Shot_Kaidan}
