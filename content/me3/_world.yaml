# Mass Effect 3: shared state.
#
# LE3's plot table *is* the ME2 table plus the ME1 table at +10000, so ME3 storylets read ME1/ME2
# decisions directly (me1.virmire.rescued_kaidan, me2.squad.legion.dead, ...); the catalog
# resolves LE3's aliases to the same canonical variables. The fate conditions below are lifted
# verbatim from LE3 and read across all three games.
game: me3
area: me3.world

traits:
  me3.mission:
    params: [code]
    doc: >-
      (v3, parameterized) Each ME3 mission stamps its completion order into
      Mission_Completion_Order.<code> and bumps Mission_Count. LE3's timing rules read these
      (Tuchanka_bomb_exploded: KroN7a done, KroN7b not, Mission_Count >= order(KroN7a) + 3).
      Missions also accrue reputation and refresh EMS.
    effects:
      - "me3.progress.mission_count += 1"
      - "me3.order.{code} = me3.progress.mission_count"
      - "me3.player.reputation += 20"
      - "me3.player.paragon += story.shepard.style == 'paragon' ? 25 : (story.shepard.style == 'balanced' ? 12 : 2)"
      - "me3.player.renegade += story.shepard.style == 'renegade' ? 25 : (story.shepard.style == 'balanced' ? 12 : 2)"
      - "me3.ems.current_rating = total('war_asset')"
    tags: [mission]

conditions:
  me3.fate.wrex_dead:
    ref: me3.cond.1630
    path: "me3:Global.Henchmen.Other.Wrex.Wrex_is_dead"
    code: "me1.bool.3028 == true || me1.bool.3029 == true || me1.bool.5543 == true || me3.bool.19769 == true"
  me3.me1.wrex_present:
    ref: me3.cond.194
    path: "me3:Utility.Henchmen.ME1.Wrex_is_present"
    code: "me1.bool.3021 == false && me1.bool.3942 == true"
    doc: >-
      Wrex ended ME1 on Shepard's squad. LE3's Wreav checks (Check_Wreav, Time_for_KroGru_Wreav_*,
      Wreav_in_warroom) test exactly the negation of this, not Wrex_is_dead: an ME1 Wrex who was
      never recruited is not "dead" in LE3's sense, but Wreav still leads.
  me3.genophage.wreav_leads:
    code: "!me3.me1.wrex_present"
    doc: Wreav, not Wrex, leads Clan Urdnot in ME3.
  me3.fate.kirrahe_dead:
    ref: me3.cond.1631
    path: "me3:Global.Henchmen.Other.Kirrahe.Kirrahe_is_Dead"
    code: "me1.bool.4464 == false || me1.bool.4459 == false"
  me3.fate.legion_dead:
    ref: me3.cond.1633
    path: "me3:Global.Henchmen.Other.Legion.Legion_is_Dead"
    code: "me2.bool.198 == true || (me2.bool.36 == true && me3.int.10173 != 0)"
  me3.fate.samara_dead:
    ref: me3.cond.1627
    path: "me3:Global.Henchmen.Other.Samara.Samara_is_Dead"
    code: "me2.bool.205 == true || me3.bool.19303 == true"
  me3.fate.thane_dead:
    ref: me3.cond.1620
    path: "me3:Global.Henchmen.Other.Thane.Thane_is_Dead"
    code: "me2.bool.201 == true || me3.bool.18714 == true"
  me3.fate.tali_dead:
    ref: me3.cond.1634
    path: "me3:Global.Henchmen.Tali.Tali_is_Dead"
    code: "me2.bool.202 == true || me3.bool.17788 == true"
  me3.fate.ashley_dead:
    ref: me3.cond.1614
    path: "me3:Global.Henchmen.Ashley.Ashley_is_Dead"
    code: "me1.bool.3828 == true || me3.bool.18199 == true || me3.bool.19525 == true || me3.bool.19523 == true || me3.bool.19527 == true || me3.bool.19521 == true || me3.bool.19519 == true"
  me3.fate.kaidan_dead:
    ref: me3.cond.1613
    path: "me3:Global.Henchmen.Kaidan.Kaiden_Is_Dead"
    code: "me1.bool.3828 == false || me3.bool.18445 == true || me3.bool.19526 == true || me3.bool.19524 == true || me3.bool.19528 == true || me3.bool.19522 == true || me3.bool.19520 == true"
  me3.fate.eve_dead:
    ref: me3.cond.1628
    path: "me3:Global.Henchmen.Other.Eve.Eve_is_Dead"
    code: "me3.int.10179 != 0 && me3.bool.20315 == false"
  me3.rannoch.peace_possible:
    ref: me3.cond.157
    path: "me3:Geth_Quarian.Gth002.Geth_2_Writing.Check_Peace_Possible_in_Theory"
    code: "me2.bool.198 == false && me2.bool.40 == true && me2.bool.1499 == true && me3.int.10176 != 0"
  me3.rannoch.peace_chance_at_least:
    ref: me3.cond.156
    path: "me3:Geth_Quarian.Gth002.Geth_2_Writing.Check_Peace_Chance"
    code: "me3.int.10212 >= argument"
  me3.rannoch.tali_admiral:
    ref: me3.cond.216
    path: "me3:Geth_Quarian.GthGlobals.NORGTH_Writing.Check_Tali_Admiral"
    code: "me2.bool.40 == true && (me2.bool.2933 == true || me2.bool.2935 == true || me2.bool.2936 == true)"
  me3.rannoch.legion_is_hologram:
    ref: me3.cond.213
    path: "me3:Geth_Quarian.GthGlobals.NORGTH_Writing.Check_Is_Legion_Hologram"
    code: "me2.bool.36 == false || me2.bool.198 == true || me2.bool.1248 == true"
  me3.tuchanka.bomb_exploded:
    ref: me3.cond.1065
    path: "me3:Genophage.Misc_Writing.Tuchanka_bomb_exploded"
    code: "me3.int.10180 != 0 && me3.int.10181 == 0 && (me3.int.10165 >= (me3.int.10180 + 3) || me3.int.10185 != 0)"
  me3.tuchanka.eve_ok:
    ref: me3.cond.1064
    path: "me3:Genophage.Misc_Writing.FemaleKrogan_Lived_Tuchanka_Okay"
    code: "( me3.int.10180 == 0 || me3.int.10181 != 0 || (me3.int.10165 < (me3.int.10180 + 3) && me3.int.10185 == 0) ) && me3.bool.20315 == true"
  me3.citadel.time_for_wrex_confrontation:
    ref: me3.cond.1043
    path: "me3:Citadel.CitHub.WrexWreav_Confront.Time_For_Contront"
    code: "me3.bool.19769 == false && me3.bool.18927 == true && me3.int.10173 > 0 && me1.bool.3021 == false && me1.bool.3942 == true"
  me3.end.im_final_persuade:
    ref: me3.cond.2711
    path: "me3:End_Game.End002.End02_NP_States.IM_Final_Persuade"
    code: "(((me3.int.10380 + me3.int.10159 + me3.int.10160) * (1.0 + me3.float.10065)) > me3.int.10644) && me3.int.10665 >= argument"
  me3.ems.rating_high:
    ref: me3.cond.1294
    path: "me3:Global.Game_Progress.Ending_Options.Rating_Level_High"
    code: "me3.int.10430 >= 3250"
  me3.ems.rating_medium:
    ref: me3.cond.1295
    path: "me3:Global.Game_Progress.Ending_Options.Rating_Level_Medium"
    code: "me3.int.10430 >= 2350 && me3.int.10430 < 3250"
  me3.ems.rating_low:
    ref: me3.cond.1296
    path: "me3:Global.Game_Progress.Ending_Options.Rating_Level_Low"
    code: "me3.int.10430 >= 0 && me3.int.10430 < 2350"
  me3.squad.morinth_banshee:
    ref: me3.cond.1764
    path: "me3:End_Game.End001.Characters.Morinth_is_a_Banshee"
    code: "me2.bool.43 == true && me2.bool.1664 == true"
  me3.player.persuasive:
    code: "(me3.player.reputation + me3.player.paragon + me3.player.renegade) * (1.0 + me3.player.persuade_multiplier) > me3.player.reputation_level5 * 0.5"
    doc: Mid-game persuasion, modeled on the shape of the lifted IM_Final_Persuade check (half its bar).
  me3.ems.can_synthesize:
    code: "me3.ems.current_rating >= 2800"
    doc: Community-documented Extended Cut threshold (the ending logic is native code, not plot data).

vars:
