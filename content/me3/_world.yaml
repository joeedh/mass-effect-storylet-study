    path: "me3:Catalyst.Cat003.500_Showdown.{path}"
    default: false
    doc: Squadmate-fired variants of the standoff; not modeled (the model has Shepard fire).

  # (v3) War assets: one tagged variable per contribution; EMS = total('war_asset').
  # Values approximate the games' war-asset ratings and assume full galactic readiness.
  story.me3.asset.{name}:
    foreach:
      - {name: alliance}
      - {name: destiny_ascension}
      - {name: me2_legacy}
      - {name: turian}
      - {name: krogan}
      - {name: aralakh_company}
      - {name: rachni}
      - {name: salarian}
      - {name: geth}
      - {name: quarian}
      - {name: asari}
      - {name: grissom_students}
      - {name: monastery}
      - {name: sanctuary}
      - {name: javik}
    type: int
    tags: [war_asset]

storylets:
  - id: me3.player.style
    title: Shepard's manner (ME3)
    trigger: auto
    priority: 90
    summary: For a Shepard with no ME2 history in this model, the dialogue style is declared here.
    requires: "story.shepard.style == ''"
    choices:
      - {id: paragon, effects: ["story.shepard.style = 'paragon'"]}
      - {id: renegade, effects: ["story.shepard.style = 'renegade'"]}
      - {id: balanced, effects: ["story.shepard.style = 'balanced'"]}
