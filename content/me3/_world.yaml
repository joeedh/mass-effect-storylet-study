  me3.progress.me2_import: {ref: me3.bool.21554, path: "me3:Global.Game_Progress.ME2_Import"}
  me3.progress.me1_import: {ref: me3.bool.22226, path: "me3:Global.Game_Progress.ME1_Import"}
  me3.ems.current_rating: {ref: me3.int.10430, path: "me3:Global.Game_Progress.Ending_Options.Current_Rating"}
  me3.end.reapers_destroyed: {ref: me3.bool.20965, path: "me3:Global.Game_Progress.Ending_Options.Reapers_Destroyed"}
